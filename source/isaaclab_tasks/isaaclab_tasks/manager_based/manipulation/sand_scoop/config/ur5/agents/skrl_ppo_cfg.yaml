# SKRL PPO configuration for Isaac-Sand-Scoop-UR5-v0
# Train with:
#   ./isaaclab.sh -p scripts/reinforcement_learning/skrl/train.py \
#       --task Isaac-Sand-Scoop-UR5-v0 \
#       --agent_cfg source/isaaclab_tasks/isaaclab_tasks/manager_based/manipulation/sand_scoop/config/ur5/agents/skrl_ppo_cfg.yaml

seed: 42

# --- PPO algorithm ---
PPO:
  rollouts: 512          # steps collected per update (single env × 512 steps)
  learning_epochs: 8
  mini_batches: 4
  discount_factor: 0.99
  lambda_: 0.95
  learning_rate: 3.0e-4
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.016
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs:
    size: 27             # num_observations
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs:
    size: 1
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: true
  entropy_loss_scale: 0.005
  value_loss_scale: 2.0
  kl_threshold: 0.0      # disabled; using KLAdaptiveLR instead
  rewards_shaper_scale: 1.0

# --- Models ---
models:
  policy:
    class: GaussianMixin
    clip_actions: false
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    network:
      - name: net
        input: STATES
        layers: [512, 256, 128]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: false
    network:
      - name: net
        input: STATES
        layers: [512, 256, 128]
        activations: elu
    output: ONE

# --- Trainer ---
Trainer:
  timesteps: 5_000_000
  headless: true
